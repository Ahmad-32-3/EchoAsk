services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  proxy:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      # ORIGIN_BACKEND: stub (default) for the reproducible benchmark path,
      # or "ollama" to point at a real local model for the live demo — see
      # README.md "Run the live demo" for the one-line switch.
      ORIGIN_BACKEND: ${ORIGIN_BACKEND:-stub}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
